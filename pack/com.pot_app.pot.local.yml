id: com.pot_app.pot
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: pot
branch: stable
rename-icon: pot
rename-desktop-file: pot.desktop

finish-args:
  - --socket=x11
  - --socket=pulseaudio
  - --share=ipc
  - --share=network
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.ayatana.indicator.application
  - --filesystem=xdg-pictures
  # Wayland 走宿主侧 relay（security-context 代理隐藏 data-control 等协议），
  # 不申请 --socket=wayland；目录由 relay 服务创建，:create 兜底
  - --filesystem=xdg-run/pot-wayland:create
  - --env=WAYLAND_DISPLAY=pot-wayland/relay.sock

modules:
  # webkit2gtk-4.0 / tesseract / libappindicator 等运行库从已安装的 flathub 版提取，
  # 避免从源码编译 webkit（runtime org.gnome.Platform 48 不含 webkit2gtk-4.0）。
  - name: app-libs
    buildsystem: simple
    build-commands:
      - tar -xf app-libs.tar
      - cp -a lib/. /app/lib/
      - cp -a libexec/. /app/libexec/
    sources:
      - type: file
        path: app-libs.tar

  - name: pot
    buildsystem: simple
    build-commands:
      # data.tar.gz 来自官方 3.0.7 deb 的 usr 树（share 资源骨架），
      # bin/pot 替换为本地编译产物（失焦关闭修复）
      - tar -xzf data.tar.gz
      - cp -a usr/share/. /app/share/
      - install -Dm755 -t /app/bin/ usr/bin/pot
      # grim 供 screenshot.rs 抓屏（zwlr_screencopy，经 relay 直连 niri）
      - install -Dm755 -t /app/bin/ usr/bin/grim
    sources:
      - type: file
        path: data.tar.gz
